# Operator configuration. Trusted: it decides what can be granted, which tools exist and which
# models are used. Agent files cannot change any of it.
version: 1

store: .legion/legion.db
artifacts: .legion/artifacts

tool_modules:
  - tools.py
tool_settings:
  workspace: workspace

providers:
  # Replays scripts/assistant.yaml. No model, no API key, same result every time.
  script:
    kind: scripted
    script: scripts/assistant.yaml
  # Any OpenAI-compatible server. Ollama shown; vLLM and llama.cpp work the same way.
  local:
    kind: openai_compat
    base_url: http://localhost:11434/v1
  anthropic:
    kind: anthropic
    access:
      kind: api_key
      secret: env:ANTHROPIC_API_KEY

models:
  - profile: general/default
    provider: script
    model: scripted
  # To use a real model, move one of these above the scripted binding (first match wins).
  - profile: general/local
    provider: local
    model: llama3.1
    features: [tools]
    pricing: {input_per_mtok: 0, output_per_mtok: 0}
  - profile: general/anthropic
    provider: anthropic
    model: claude-sonnet-5-5
    features: [tools, prompt_caching]

authority:
  # The widest authority any agent run from this configuration can hold.
  grantable:
    - files.read:notes/**
    - files.write:out/**

policy:
  default: allow
  rules:
    - decision: deny
      effect: external_irreversible
      reason: irreversible actions need human approval, which is not available yet

credentials: {}
