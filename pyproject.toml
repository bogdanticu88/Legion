[project]
name = "legion-runtime"
dynamic = ["version"]
description = "A small Python runtime between an LLM agent and its tools: the model decides what to try, Legion decides what runs."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mihai Bogdan Ticu" }]
keywords = ["agents", "llm", "runtime", "harness", "capabilities", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.22,<5",
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "referencing>=0.28,<1",
]

[project.scripts]
legion = "legion.cli:app"

[project.urls]
Homepage = "https://github.com/bogdanticu88/Legion"
Repository = "https://github.com/bogdanticu88/Legion"
Issues = "https://github.com/bogdanticu88/Legion/issues"
Changelog = "https://github.com/bogdanticu88/Legion/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = [
    "mcp>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.22",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
# the one place the version is written; the package metadata is read from it at build time
path = "src/legion/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/legion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: calls a real model endpoint; skipped unless the endpoint is configured",
    "demo: the demonstrations docs/demos.md says run as tests",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/legion"]
plugins = ["pydantic.mypy"]
