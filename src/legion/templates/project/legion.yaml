# Operator config. Agents can't change anything in here.
version: 1

store: .legion/legion.db
artifacts: .legion/artifacts

tool_modules:
  - tools.py
tool_settings:
  workspace: workspace

providers:
  # replays scripts/assistant.yaml, no model or key needed
  script:
    kind: scripted
    script: scripts/assistant.yaml
  # any OpenAI-compatible server (Ollama here, vLLM/llama.cpp work too)
  local:
    kind: openai_compat
    base_url: http://localhost:11434/v1
  anthropic:
    kind: anthropic
    access:
      kind: api_key
      secret: env:ANTHROPIC_API_KEY

models:
  - profile: general/default
    provider: script
    model: scripted
  # for a real model, rename one of these to general/default (first match wins)
  - profile: general/local
    provider: local
    model: llama3.1
    features: [tools]
    pricing: {input_per_mtok: 0, output_per_mtok: 0}
  - profile: general/anthropic
    provider: anthropic
    model: claude-sonnet-5-5
    features: [tools, prompt_caching]

authority:
  # the most any agent can be given
  grantable:
    - files.read:notes/**
    - files.write:out/**

policy:
  default: allow
  rules:
    - decision: deny
      effect: external_irreversible
      reason: irreversible actions need human approval, which is not available yet

credentials: {}
