name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: {python-version: "${{ matrix.python }}"}
      - run: uv sync --locked --extra mcp
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build
      # the built wheel, installed in a fresh virtualenv, runs the offline quickstart
      - run: scripts/wheel-smoke.sh dist/legion_runtime-*.whl

  audit:
    # known vulnerabilities in what a user installs (runtime dependencies and the mcp extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: {python-version: "3.12"}
      - run: >-
          uv export --locked --all-extras --no-dev --no-emit-project --no-hashes
          --format requirements-txt -o requirements-audit.txt
      - run: uvx --from pip-audit==2.10.1 pip-audit --strict -r requirements-audit.txt

  base:
    # without the mcp extra: Legion has to work, and MCP tests are left out
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: {python-version: "3.12"}
      - run: uv sync --locked
      - run: uv run python -c "import importlib.util as u; assert u.find_spec('mcp') is None"
      - run: uv run pytest
